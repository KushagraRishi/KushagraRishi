<style>@font-face{font-family:'HG';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'NR';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PM';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
