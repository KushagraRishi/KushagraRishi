<style>@font-face{font-family:'BG';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'BR';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PM';font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
